{% extends 'base.html' %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="relative w-[390px] h-[700px] bg-white rounded-3xl border overflow-hidden flex flex-col shadow-xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-4 border-b bg-white">

            <div class="flex items-center gap-5 text-xl">
                <button>
                    <i class="fa-solid fa-user-group text-yellow-400"></i>
                </button>

                <button>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <h1 class="text-xl font-semibold">Chat</h1>

            <div class="flex items-center gap-5 text-xl">
                <button>
                    <i class="fa-regular fa-bell"></i>
                </button>

                <button class="w-8 h-8 rounded-full bg-yellow-300 flex items-center justify-center">
                    <i class="fa-solid fa-user-plus text-black text-sm"></i>
                </button>

                <button>
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>

        </div>

        <!-- Chat List -->
        <div class="flex-1 overflow-y-auto px-4 py-2 space-y-2">

            <!-- Chat 1 -->
            <div class="flex justify-between items-center p-2 rounded-xl hover:bg-gray-100 cursor-pointer">
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/100?img=11"
                        class="w-12 h-12 rounded-full">

                    <div>
                        <h2 class="font-semibold">Akshat</h2>
                        <p class="text-sm text-red-500">New Snap • 2m</p>
                    </div>
                </div>

                <span class="text-xs text-gray-400">2m</span>
            </div>

            <!-- Chat 2 -->
            <div class="flex justify-between items-center p-2 rounded-xl hover:bg-gray-100 cursor-pointer">
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/100?img=12"
                        class="w-12 h-12 rounded-full">

                    <div>
                        <h2 class="font-semibold">Rahul</h2>
                        <p class="text-sm text-blue-500">Opened • 5m</p>
                    </div>
                </div>

                <span class="text-xs text-gray-400">5m</span>
            </div>

            <!-- Chat 3 -->
            <div class="flex justify-between items-center p-2 rounded-xl hover:bg-gray-100 cursor-pointer">
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/100?img=13"
                        class="w-12 h-12 rounded-full">

                    <div>
                        <h2 class="font-semibold">Kevin</h2>
                        <p class="text-sm text-gray-500">Received • 10m</p>
                    </div>
                </div>

                <span class="text-xs text-gray-400">10m</span>
            </div>

            <!-- Chat 4 -->
            <div class="flex justify-between items-center p-2 rounded-xl hover:bg-gray-100 cursor-pointer">
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/100?img=14"
                        class="w-12 h-12 rounded-full">

                    <div>
                        <h2 class="font-semibold">Rohit</h2>
                        <p class="text-sm text-red-500">New Chat • 20m</p>
                    </div>
                </div>

                <span class="text-xs text-gray-400">20m</span>
            </div>

            <!-- Chat 5 -->
            <div class="flex justify-between items-center p-2 rounded-xl hover:bg-gray-100 cursor-pointer">
                <div class="flex items-center gap-3">
                    <img src="https://i.pravatar.cc/100?img=15"
                        class="w-12 h-12 rounded-full">

                    <div>
                        <h2 class="font-semibold">Neha</h2>
                        <p class="text-sm text-blue-500">Opened • 1h</p>
                    </div>
                </div>

                <span class="text-xs text-gray-400">1h</span>
            </div>

        </div>

        <!-- Bottom Navigation -->
        <div class="border-t bg-black">
            <div class="flex justify-around py-3">

                <button class="flex flex-col items-center text-gray-500 hover:text-white">
                    <i class="fa-solid fa-location-dot text-xl"></i>
                    <span class="text-xs">Map</span>
                </button>

                <button class="flex flex-col items-center text-white">
                    <i class="fa-solid fa-message text-xl"></i>
                    <span class="text-xs font-semibold">Chat</span>
                </button>

                <button class="flex flex-col items-center text-gray-500 hover:text-white">
                    <i class="fa-solid fa-camera text-xl"></i>
                    <span class="text-xs">Camera</span>
                </button>

                <button class="flex flex-col items-center text-gray-500 hover:text-white">
                    <i class="fa-solid fa-user-group text-xl"></i>
                    <span class="text-xs">Stories</span>
                </button>

            </div>
        </div>

    </div>
</div>

{% endblock %}

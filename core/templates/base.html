{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Snapchat Clone{% endblock %}</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
 <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
    </style>

</head>


<body class="h-full overflow-hidden font-sans">
    <div class="h-dvh overflow-hidden bg-white sm:bg-neutral-950 flex justify-center items-center sm:p-6">
        <div
            class="relative w-full h-full min-h-0 overflow-hidden bg-white sm:w-auto sm:h-[min(812px,calc(100dvh-3rem))] sm:aspect-[450/845] sm:border-[2px] sm:border-neutral-800 sm:rounded-[1.75rem]">
            {% comment %} <div class="relative w-full min-h-0 h-full overflow-hidden sm:rounded-[1.35rem]">
                {% block content %}
                {% endblock %}
            </div> {% endcomment %}
            <div class="relative w-full min-h-0 h-full overflow-y-auto overflow-x-hidden sm:rounded-[1.35rem]">
    {% block content %}
    {% endblock %}
</div>
        </div>
    </div>
    <script src="{% static 'index.js' %}"></script>
</body>
</html>
